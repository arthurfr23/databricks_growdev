# Aula 21: módulo de transformação.
resources:
  jobs:
    growdev_transformacao:
      name: growdev_transformacao
      parameters:
        - name: catalogo
          default: ${var.catalogo}
      tasks:
        - task_key: silver
          notebook_task:
            notebook_path: ../Projeto/02_silver.ipynb
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../Projeto/03_gold.ipynb

